
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Companion AI</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">

    <header>
      <div>
        <h1>Companion AI</h1>
        <small>Seu companheiro com memória</small>
      </div>

      <div class="header-actions">
        <button id="memoryBtn" type="button" title="Minha memória">🧠</button>
        <button id="settingsBtn" type="button" title="Configurações">⚙️</button>
      </div>
    </header>

    <section id="messages" class="messages"></section>

    <form id="chatForm" class="composer">
      <textarea id="messageInput"
                rows="1"
                placeholder="Digite sua mensagem..."
                required></textarea>

      <button type="submit">Enviar</button>
    </form>

  </main>

  <!-- MEMÓRIA -->

  <dialog id="memoryDialog">

    <div class="settings">

      <div class="dialog-header">
        <h2>🧠 Minha memória</h2>
        <button id="closeMemoryBtn" type="button">✕</button>
      </div>

      <p>
        Informações que o Companion lembra de você.
      </p>

      <div id="memoryStatus">Carregando...</div>

      <textarea id="memoryText" rows="10"></textarea>

      <div class="row">
        <button id="deleteMemoryBtn"
                class="danger"
                type="button">
          Apagar
        </button>

        <button id="saveMemoryBtn"
                type="button">
          Salvar
        </button>
      </div>

    </div>

  </dialog>

  <!-- CONFIGURAÇÕES -->

  <dialog id="settingsDialog">

    <div class="settings">

      <h2>Configurações</h2>

      <label>
        Nome
        <input id="userName">
      </label>

      <label>
        Modelo
        <input id="model" value="gpt-5-mini">
      </label>

      <hr>

      <h3>🔄 Sincronizar PC e Celular</h3>

      <p class="sync-info">
        Use a mesma chave nos dois aparelhos para compartilhar a mesma memória.
      </p>

      <label>
        Minha chave de sincronização
        <input id="syncKey"
               placeholder="Ex.: PEDRO-2026-AB12">
      </label>

      <div class="row">
        <button id="generateKeyBtn"
                type="button">
          Gerar chave
        </button>

        <button id="copyKeyBtn"
                type="button">
          Copiar
        </button>
      </div>

      <p id="syncStatus"></p>

      <hr>

      <div class="row">
        <button id="clearBtn"
                class="danger"
                type="button">
          Apagar conversa
        </button>

        <button id="saveBtn"
                type="button">
          Salvar
        </button>
      </div>

    </div>

  </dialog>

  <script src="app.js"></script>

</body>
</html>
