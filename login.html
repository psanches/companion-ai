
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Entrar na Lumi</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .login {
      width: min(90%, 380px);
      padding: 28px;
      background: #1f2937;
      border-radius: 18px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    p {
      text-align: center;
      color: #d1d5db;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    input {
      border: 1px solid #6b7280;
      background: #374151;
      color: white;
    }

    button {
      border: none;
      background: #6366f1;
      color: white;
      cursor: pointer;
    }

    .google {
      background: white;
      color: #111827;
    }

    #status {
      min-height: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="login">
    <h1>Olá! Eu sou a Lumi 💜</h1>
    <p>Sua companheira digital.</p>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Seu e-mail"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Sua senha"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        Entrar
      </button>
    </form>

    <button id="signup" type="button">
      Criar minha conta
    </button>

    <p>ou</p>

    <button
      id="google"
      class="google"
      type="button"
    >
      Continuar com Google
    </button>

    <p id="status" role="status"></p>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
