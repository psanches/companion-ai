name: Lumi isolated institutional preview
on:
  push:
    branches: [feature/lumi-institutional-refresh-20261017]
    paths: ['lumi-website/**', '.github/workflows/lumi-institutional-preview.yml']
permissions:
  contents: read
concurrency:
  group: lumi-institutional-preview-20261017
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/feature/lumi-institutional-refresh-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lumi-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test isolated bilingual site
        run: npm run build && npm test
      - name: Desktop and Android simulations, accessibility and screenshots
        run: npx playwright install --with-deps chromium && npm run test:browser
      - name: Deploy only separate institutional preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
        run: node deploy-preview.mjs
      - name: Preserve screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-preview-${{ github.sha }}
          path: |
            lumi-website/screenshots/
            lumi-website/test-results/
            lumi-website/dist/
