name: Temporary hosted news validation
on:
  push:
    branches: [feature/pc-android-permanent-fix-20261016]
    paths: ['lumi-ativa-integration/health-news-hosted-validation.mjs', '.github/workflows/lumi-news-hosted-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[news-hosted-validate]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test hosted runtime, remove temporary Worker, keep Develop code and cron unchanged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
        run: node lumi-ativa-integration/health-news-hosted-validation.mjs
