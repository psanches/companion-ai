name: Medical security unit tests
on:
  push:
    branches:
      - feature/medical-security-gates-20261012
    paths:
      - 'medical/**'
      - '.github/workflows/medical-security-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: medical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run medical security unit tests
        run: npm test
      - name: Verify Cloudflare staging bundle without deploying
        run: node assert-staging-deployment.mjs && npm run build:staging
