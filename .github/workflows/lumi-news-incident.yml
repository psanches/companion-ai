name: Lumi news incident investigation
on:
  push:
    branches: [feature/pc-android-permanent-fix-20261016]
    paths: ['lumi-ativa-integration/health-news-incident.mjs', 'lumi-ativa-integration/health-news-generation-diagnostic.mjs', '.github/workflows/lumi-news-incident.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read cron and public edition evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
        run: node lumi-ativa-integration/health-news-incident.mjs
