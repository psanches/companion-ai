name: Lumi development Ativa integration
on:
  push:
    branches: [feature/lumi-develop-ativa-integration]
    paths: ['lumi-ativa-integration/request.json', '.github/workflows/lumi-ativa-integration.yml']
permissions:
  contents: read
concurrency:
  group: lumi-develop-ativa-integration
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect exact deployed development Worker without secrets or patient data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
        run: node lumi-ativa-integration/inspect.mjs
