name: Lumi development Ativa integration
# Authorized one-time Lumi Develop research rollout; production is excluded.
# Retry after verified CI, version discovery and asset propagation fixes.
on:
  push:
    branches: [feature/restore-lumi-home-20261014]
  workflow_dispatch:
    inputs:
      inspect_only:
        description: 'Read-only deployment history, modules and configuration (no deploy)'
        type: boolean
        default: false
      confirm:
        description: 'Type DEPLOY_LUMI_DEVELOP_ONLY to publish sandbox (never production)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: lumi-develop-ativa-integration
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/feature/restore-lumi-home-20261014' && inputs.inspect_only == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect only lumi-develop (no deployment)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
        run: node lumi-ativa-integration/inspect.mjs
  integrate:
    if: github.ref == 'refs/heads/feature/restore-lumi-home-20261014' && ((github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY_LUMI_DEVELOP_ONLY' && inputs.inspect_only != true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[health-news-develop-deploy]')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build package for executable deployment regression test
        run: node lumi-ativa-integration/build-assets.mjs
      - name: Existing medical security suite, unchanged
        working-directory: medical
        run: npm install --ignore-scripts --no-audit --no-fund && npm test
      - name: Synthetic demo and integration regression tests
        working-directory: ativa-demo
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test && node --test ../lumi-ativa-integration/tests/*.test.mjs
      - name: Research and authenticated route tests (no deploy)
        run: node --test lumi-research/*.test.mjs lumi-ativa-integration/research-hook.test.mjs
      - name: Read-only preflight deployment history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
        run: node lumi-ativa-integration/inspect.mjs
      - name: Package synthetic Lumi UI
        run: node lumi-ativa-integration/build-assets.mjs
      - name: Integrate only authorized lumi-develop sandbox, preserving baseline and bindings
        env:
          LUMI_DEPLOY_CONFIRM: ${{ github.event_name == 'push' && 'DEPLOY_LUMI_DEVELOP_ONLY' || inputs.confirm }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
          DEMO_ACCESS_CODE: ${{ secrets.ATIVA_DEMO_ACCESS_CODE }}
          LUMI_RESEARCH_OPENAI_API_KEY: ${{ secrets.LUMI_RESEARCH_OPENAI_API_KEY }}
        run: node lumi-ativa-integration/deploy.mjs
