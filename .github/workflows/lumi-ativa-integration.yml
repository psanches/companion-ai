name: Lumi development Ativa integration
# Authorized one-time Lumi Develop research rollout; production is excluded.
# Retry after verified CI, version discovery and asset propagation fixes.
on:
  push:
    branches: [feature/pc-android-permanent-fix-20261016]
  workflow_dispatch:
    inputs:
      inspect_only:
        description: 'Read-only deployment history, modules and configuration (no deploy)'
        type: boolean
        default: false
      confirm:
        description: 'Type DEPLOY_LUMI_DEVELOP_ONLY to publish sandbox (never production)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: lumi-develop-ativa-integration
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/feature/pc-android-permanent-fix-20261016' && inputs.inspect_only == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect only lumi-develop (no deployment)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
        run: node lumi-ativa-integration/inspect.mjs
  integrate:
    if: github.ref == 'refs/heads/feature/pc-android-permanent-fix-20261016' && ((github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY_LUMI_DEVELOP_ONLY' && inputs.inspect_only != true) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[pc-android-develop-deploy]') || contains(github.event.head_commit.message, '[calendar-develop-deploy]'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build package for executable deployment regression test
        run: node lumi-ativa-integration/build-assets.mjs
      - name: Existing medical security suite, unchanged
        working-directory: medical
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test
      - name: Synthetic demo and integration regression tests
        working-directory: ativa-demo
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test && node --test ../lumi-ativa-integration/tests/*.test.mjs
      - name: Research and authenticated route tests (no deploy)
        run: node --test lumi-research/*.test.mjs lumi-ativa-integration/research-hook.test.mjs health-news-preview.test.mjs
      - name: Frontend cache contracts and desktop/Android viewport simulations
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm test --prefix frontend
          node frontend/node_modules/playwright/cli.js install --with-deps chromium
          mkdir -p frontend/test-results
          npm run test:browser --prefix frontend
      - name: Preserve frontend validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-${{ github.sha }}
          path: frontend/test-results/
      - name: Configure and verify private model budget before enabling it
        if: contains(github.event.head_commit.message, '[model-budget-setup]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
        run: node lumi-ativa-integration/configure-model-budget.mjs
      - name: Read-only preflight deployment history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
        run: node lumi-ativa-integration/inspect.mjs
      - name: Package synthetic Lumi UI
        run: node lumi-ativa-integration/build-assets.mjs
      - name: Integrate only authorized lumi-develop sandbox, preserving baseline and bindings
        env:
          LUMI_DEPLOY_CONFIRM: ${{ github.event_name == 'push' && 'DEPLOY_LUMI_DEVELOP_ONLY' || inputs.confirm }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
          DEMO_ACCESS_CODE: ${{ secrets.ATIVA_DEMO_ACCESS_CODE }}
          LUMI_RESEARCH_OPENAI_API_KEY: ${{ secrets.LUMI_RESEARCH_OPENAI_API_KEY }}
        run: node lumi-ativa-integration/deploy.mjs
      - name: Verify Calendar frontend and authentication boundaries (no calendar writes)
        run: node lumi-calendar/deployed-check.mjs
      - name: Verify microphone control package (no audio capture)
        run: node frontend/voice-deployed-check.mjs
      - name: Verify beta feedback UI and access boundaries (no reports submitted)
        run: node lumi-beta/deployed-check.mjs
      - name: Verify existing public health-news edition (read-only)
        run: node frontend/health-news-check.mjs
      - name: Refresh verified public news after the development UI is published
        if: contains(github.event.head_commit.message, '[news-week-start]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
          LUMI_RESEARCH_OPENAI_API_KEY: ${{ secrets.LUMI_RESEARCH_OPENAI_API_KEY }}
        run: node lumi-ativa-integration/run-news-week.mjs
  health_news_check:
    # News generation stays disabled until the official beta launch review.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise scheduled news handler in temporary runtime and verify Lumi edition
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
          LUMI_RESEARCH_OPENAI_API_KEY: ${{ secrets.LUMI_RESEARCH_OPENAI_API_KEY }}
        run: node lumi-ativa-integration/health-news-smoke.mjs

  calendar_inspect:
    if: github.ref == 'refs/heads/feature/pc-android-permanent-fix-20261016' && github.event_name == 'push' && contains(github.event.head_commit.message, '[calendar-inspect]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only Calendar code and binding inspection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
        run: node lumi-ativa-integration/calendar-inspect.mjs

  calendar_auth_runtime:
    if: github.ref == 'refs/heads/feature/pc-android-permanent-fix-20261016' && github.event_name == 'push' && contains(github.event.head_commit.message, '[calendar-auth-runtime-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare fetch modes in isolated Worker with invalid test session
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
        run: node lumi-calendar/auth-runtime-check.mjs


  refresh_news:
    if: github.ref == 'refs/heads/feature/pc-android-permanent-fix-20261016' && github.event_name == 'push' && contains(github.event.head_commit.message, '[news-week-refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared news collection and authorized window
        run: node --test health-news-preview.test.mjs lumi-ativa-integration/tests/health-news-week.test.mjs
      - name: Refresh only the shared public edition within its authorized week
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ATIVA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ATIVA_CLOUDFLARE_ACCOUNT_ID }}
          LUMI_RESEARCH_OPENAI_API_KEY: ${{ secrets.LUMI_RESEARCH_OPENAI_API_KEY }}
        run: node lumi-ativa-integration/run-news-week.mjs
