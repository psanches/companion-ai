name: Lumi weather research diagnostic
on:
  push:
    branches: [feature/pc-android-permanent-fix-20261016]
    paths: [.github/workflows/lumi-weather-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      OPENAI_API_KEY: ${{ secrets.LUMI_RESEARCH_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public weather queries through chat and research with synthetic session and memory
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {withCompanionChat} from './lumi-ativa-integration/companion-chat.mjs';
          import {createLumiResearchHandler} from './lumi-research/handler.mjs';
          if (!process.env.OPENAI_API_KEY) throw Error('Missing existing research credential');
          const origin='https://lumi-develop.psanchesnle.workers.dev';
          for (const [index,question] of ['Vai chover hoje?','Qual a previsão do tempo para Bauru amanhã?','Weather forecast for Bauru today'].entries()) {
            let calls=0, saved, limited=0;
            const research=createLumiResearchHandler({fetcher:async(url,options)=>{
              if(url.endsWith('/auth/v1/user'))return Response.json({id:'synthetic-weather-check'});
              assert.equal(url,'https://api.openai.com/v1/responses');
              calls++;
              assert.match(JSON.parse(options.body).input[1].content,/Cidade da previsão: Bauru/);
              assert.equal(JSON.parse(options.body).tools[0].user_location.city,'Bauru');
              // Reproduce wrong-city forecasts with valid citations before a live recovery query.
              if(index===0&&calls===1)return Response.json({status:'completed',output:[{type:'web_search_call',status:'completed'},{type:'message',content:[{type:'output_text',text:'São Paulo: chuva. Curitiba: sol.',annotations:[{type:'url_citation',url:'https://example.org/forecast/sao-paulo',title:'São Paulo forecast'}]}]}]});
              const response=await fetch(url,options),data=await response.clone().json();
              console.log(JSON.stringify({case:index+1,attempt:calls,httpStatus:response.status,status:data.status,searches:(data.output||[]).filter(x=>x.type==='web_search_call'&&x.status==='completed').length,citations:(data.output||[]).flatMap(x=>x.content||[]).flatMap(x=>x.annotations||[]).filter(x=>x.type==='url_citation').length}));
              return response;
            }});
            const chat=withCompanionChat({fetch(){throw Error('Research fell through to ordinary chat');}},{verify:async()=>({id:'synthetic-weather-check'}),research});
            const response=await chat.fetch(new Request(origin+'/api/chat',{method:'POST',headers:{origin,authorization:'Bearer synthetic-session','content-type':'application/json','x-lumi-language':index===2?'en':'pt-BR'},body:JSON.stringify({message:question})}),{
              LUMI_RESEARCH_OPENAI_API_KEY:process.env.OPENAI_API_KEY,
              LUMI_RESEARCH_RATE_LIMIT:{limit:async()=>{limited++;return {success:true};}},
              Memory:{get:async(key)=>key==='memory:user:synthetic-weather-check'?'Localização registrada como Bauru, SP.':[],put:async(key,value)=>{saved=JSON.parse(value);}}
            },{});
            const data=await response.json();
            console.log(JSON.stringify({case:index+1,researchStatus:data.researchStatus,apiCalls:calls,authenticatedChatPath:'/api/chat',syntheticMemoryOnly:true}));
            assert.equal(response.status,200);assert.equal(data.researchStatus,'complete');assert.match(data.reply,/Bauru/i);assert.doesNotMatch(data.reply,/(?:^|\n)\s*[ABC]\)|\bcurl\b|colar um link|paste a link/i);assert.match(data.reply,/\[(Fonte|Source)\]\(https:\/\//);assert.equal(saved.at(-1).content,data.reply);assert.equal(limited,1);assert.ok(calls<=2);
          }
          NODE
